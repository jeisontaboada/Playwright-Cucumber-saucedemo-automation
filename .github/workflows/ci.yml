name: Playwright + Cucumber Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # permite disparar el workflow manualmente desde la pestaña Actions

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala Node.js 20 y activa caché de npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala las dependencias del package.json
      - name: Install dependencies
        run: npm ci

      # 4. Instala solo Chromium (el único browser que usa el proyecto)
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 5. Ejecuta todos los tests
      #    Las credenciales vienen de GitHub Secrets → no hay .env en el repo
      - name: Run all tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          LOCKED_USER: ${{ secrets.LOCKED_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          INVALID_USER: ${{ secrets.INVALID_USER }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
          ACTION_TIMEOUT: '15000'
          NAVIGATION_TIMEOUT: '30000'
          HEADLESS: 'true'
          RECORD_VIDEO: 'false'
        run: npm test

      # 6. Genera el dashboard HTML enriquecido
      #    always() → se genera incluso si los tests fallaron
      - name: Generate HTML report
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npm run report

      # 7. Sube los reportes como artefacto descargable desde GitHub
      #    Disponible 7 días después de cada ejecución
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ github.run_number }}
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json
            reports/html-report/
            reports/screenshots/
          retention-days: 7
